[package]
name = "embassy-debug"
version = "0.1.0"
description = "Host-tested UART event lines for the Sticky embassy-debug image"
readme = "README.md"
publish = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Pair card and `pair` UART lines. Default embassy-debug-fw enables this.
pair = []
# Survey / SoftAP cards and `wifi_survey` / `wifi_ap` / `wifi_http` lines.
# Default embassy-debug-fw enables this with `pair`.
wifi = []

[dev-dependencies]
seeed-reterminal-sticky = { path = "../seeed-reterminal-sticky", version = "0.1.0" }

[lints]
workspace = true
