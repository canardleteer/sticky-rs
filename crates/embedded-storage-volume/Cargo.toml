[package]
name = "embedded-storage-volume"
version = "0.1.0"
description = "Partitioned managed-media storage, littlefs and FAT32 adapters, and update staging"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
embedded-sdmmc = { version = "=0.10.0", default-features = false, optional = true }
littlefs2 = { version = "=0.8.1", default-features = false, features = ["alloc"] }
fatfs = { package = "starry-fatfs", version = "=0.4.1-preview.2", default-features = false, features = ["alloc", "lfn", "unicode"] }
hadris-storage = { version = "=2.5.0", default-features = false, features = ["sync"] }
gpt_disk_types = { version = "=0.16.1", default-features = false }
gpt_disk_io = { version = "=0.17.0", default-features = false }
embedded-io = "0.7"
hadris-io = { version = "=2.5.0", default-features = false }
embedded-hal.workspace = true
sha2 = { version = "0.11", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde-json-core = "0.6"

[features]
default = []
sd = ["dep:embedded-sdmmc"]

[lints]
workspace = true
