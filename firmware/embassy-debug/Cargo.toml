[package]
name = "embassy-debug-fw"
version = "0.1.0"
edition = "2021"
publish = false
description = "reTerminal Sticky Embassy event-logger image. Flash only via cargo xtask flash-app after a matching original exists."
license = "MIT"

# Workspace member, not a default-member: host `cargo test` skips this
# package. Build with `cargo xtask build-fw embassy-debug` (or
# `cargo +esp build -p embassy-debug-fw --profile release-fw --target
# xtensa-esp32s3-none-elf -Zbuild-std=core,alloc`). Host-tested UART lines
# live in crates/embassy-debug.
# Do not inherit [lints] workspace = true (missing_docs / unsafe_code).

[dependencies]
# crates.io `esp-rtos` 0.3.0 still pins `esp-hal` ~1.1. Take the HAL family
# from the 1.2.0-rc.0 tag so Embassy and `esp-hal` are one graph.
esp-hal = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = [
  "esp32s3",
  "unstable",
] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = [
  "esp32s3",
  "embassy",
] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", optional = true, features = [
  "esp32s3",
  "unstable",
] }
bt-hci = { version = "0.9.0", optional = true }
trouble-host = { version = "0.7.0", optional = true, default-features = false, features = [
  "default-packet-pool-mtu-255",
] }
esp-println = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", default-features = false, features = [
  "esp32s3",
  "uart",
  "critical-section",
] }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = [
  "esp32s3",
] }
# lsm6ds3tr pulls `alloc` (`Vec` on the IRQ path). A small internal heap is
# enough; we never call that path.
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.0-rc.0", features = [
  "esp32s3",
] }

embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"

seeed-reterminal-sticky = { path = "../../crates/seeed-reterminal-sticky" }
embassy-debug = { path = "../../crates/embassy-debug" }
bq25616 = { path = "../../crates/bq25616" }
bq27220 = { path = "../../crates/bq27220", optional = true }

lsm6ds3tr = "0.2.2"

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-hal-bus = "0.3.0"
embedded-graphics.workspace = true
ssd1677-gray4 = { path = "../../crates/ssd1677-gray4", default-features = false, features = [
  "async",
] }
static_cell = "2.1.1"
heapless = { version = "0.8.0", optional = true }
embedded-sdmmc = { version = "0.10.0", optional = true, default-features = false }
embassy-net = { version = "0.9.0", optional = true, features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
edge-dhcp = { version = "0.8.0", optional = true }
edge-nal = { version = "0.7.0", optional = true }
edge-nal-embassy = { version = "0.9.0", optional = true }
embedded-io-async = { version = "0.7", optional = true }

[features]
# Pair + Wi-Fi survey / SoftAP cards. Advertise BLE only while the
# pair card is showing. Survey and SoftAP stay idle until a tap.
# Exclusive sits (`mic` / `radio` / `charge` / `sd`) must pass
# `--no-default-features` (xtask `build-fw` / `ci` do).
default = ["pair", "wifi"]
# Enable MicRail + I2S PDM RX and print `mic rms=` / `peak=` lines.
# Community 16 kHz / 16-bit / left recipe; unconfirmed on this unit.
mic = []
# Desk-only: clock the panel at the SSD1677 serial max (20 MHz).
# Default image stays at board `SPI_MAX_HZ` (10 MHz). Card CS stays
# high. Do not combine with `mic` or `radio` for a desk test.
spi20 = []
# Read-only MicroSD identify + FAT list (board `sd` + embedded-sdmmc).
# Init ≤ 400 kHz, then status at 10 MHz and 20 MHz. Root list and one
# ReadOnly file read. No writes. Do not combine with `mic` or `radio`.
sd = ["dep:embedded-sdmmc"]
# Attended BQ25616 `/CE` pulse (≤ 2 s) when GPIO9 is high. Parks
# after. Do not combine with `mic`, `radio`, `pair`, `wifi`, or `sd`. Default
# image stays parked.
charge = ["dep:bq27220"]
# Concurrent Wi-Fi + BLE scan on the on-board antenna. Scan only: no
# STA join, no SoftAP, no BLE connect. Does not print MAC / BSSID.
# Independent of `mic`; do not CI both at once. Do not combine with
# `pair` or `wifi`.
radio = [
  "dep:esp-radio",
  "dep:bt-hci",
  "dep:trouble-host",
  "dep:heapless",
  "esp-rtos/esp-radio",
  "esp-radio/wifi",
  "esp-radio/ble",
  "esp-radio/coex",
  "trouble-host/scan",
]
# Channel survey + WPA2 SoftAP / DHCP / JSON HTTP cards. Packs with
# `pair`. Idle until a tap. No factory NVS. No neighbor SSID / MAC /
# BSSID on UART. Do not combine with `mic`, `radio`, `charge`, or `sd`.
wifi = [
  "dep:esp-radio",
  "dep:embassy-net",
  "dep:edge-dhcp",
  "dep:edge-nal",
  "dep:edge-nal-embassy",
  "dep:embedded-io-async",
  "embassy-debug/wifi",
  "esp-rtos/esp-radio",
  "esp-radio/wifi",
  "esp-radio/ble",
  "esp-radio/coex",
]
# BLE peripheral + DisplayOnly passkey card. Advertise `sticky-rs`.
# RAM bonds only; no factory NVS; no eFuse MAC on UART. Walkthrough:
# src/pair.rs. Do not combine with `mic`, `radio`, `charge`, or `sd`.
# `legacy-pairing` is the passkey path. `central` is required so
# trouble-host 0.7 defines GAP_SERVICE_ATTRIBUTE_COUNT (security +
# derive alone is not enough).
pair = [
  "dep:esp-radio",
  "dep:bt-hci",
  "dep:trouble-host",
  "embassy-debug/pair",
  "esp-rtos/esp-radio",
  "esp-radio/ble",
  "trouble-host/peripheral",
  "trouble-host/gatt",
  "trouble-host/security",
  "trouble-host/legacy-pairing",
  "trouble-host/derive",
  # 0.7 only defines GAP_SERVICE_ATTRIBUTE_COUNT with security+central.
  "trouble-host/central",
]
