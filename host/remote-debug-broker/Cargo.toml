[package]
name = "remote-debug-broker"
version = "0.1.0"
description = "ConnectRPC owner that holds 0..N remote-debug GATT Sessions"
readme = "README.md"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
buffa = { version = "0.9.2", features = ["json"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["server", "client", "json"] }
ctrlc = "3.5.2"
panel-view = { path = "../../crates/panel-view", version = "0.1.0" }
remote-debug-host = { path = "../remote-debug-host", version = "0.1.0" }
remote-debug-wire = { path = "../../crates/remote-debug-wire", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[build-dependencies]
buf-tools = "1.75.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
