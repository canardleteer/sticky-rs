[package]
name = "remote-debug-broker"
version = "0.1.0"
description = "Unix-socket JSON RPC broker that owns one remote-debug GATT Session"
readme = "README.md"
publish = true
edition.workspace = true
# Matches sticky-host / remote-debug-host. Workspace no_std crates stay 1.85.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ctrlc = "3.4.7"
panel-view = { path = "../../crates/panel-view", version = "0.1.0" }
remote-debug-host = { path = "../remote-debug-host", version = "0.1.0" }
remote-debug-wire = { path = "../../crates/remote-debug-wire", version = "0.1.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
tempfile = "3.20.0"

[lints]
workspace = true
