syntax = "proto3";

package sticky.remote.shared.v1;

// Shared desk-debug messages for last-compose snapshot and faux
// physical inject. GATT `Envelope` and the host ConnectRPC service
// both import this package. Transport is not specified here.

// Who produced a tap. Injects must be SYNTHETIC.
enum TouchSource {
  // Protobuf zero value. Rejected by inject mapping.
  TOUCH_SOURCE_UNSPECIFIED = 0;
  // Glass / GT911 sample. Host injects must not send this.
  TOUCH_SOURCE_PHYSICAL = 1;
  // Host-synthesized tap or slide. Required for inject-touch.
  TOUCH_SOURCE_SYNTHETIC = 2;
}

// Right-edge keys. Firmware maps these to GPIO; the schema stays
// product names, not pad numbers.
enum ProductKey {
  // Protobuf zero value. Rejected by inject mapping.
  PRODUCT_KEY_UNSPECIFIED = 0;
  // Sticky AI Voice / OK (GPIO4).
  PRODUCT_KEY_OK = 1;
  // Sticky Page Up (GPIO5).
  PRODUCT_KEY_PAGE_UP = 2;
  // Sticky Page Down (GPIO6).
  PRODUCT_KEY_PAGE_DOWN = 3;
}

// How many 1-bit planes the frozen compose used.
enum FrameKind {
  // Protobuf zero value. Rejected by snapshot mapping.
  FRAME_KIND_UNSPECIFIED = 0;
  // Black/white only. `red` must be empty.
  FRAME_KIND_MONO = 1;
  // Four-gray dual plane. `red` is the second packed SSD1677
  // plane (controller name; this panel has no red pigment).
  FRAME_KIND_GRAY4 = 2;
}

// Finger phase. Unset is a tap (DOWN). MOVE does not re-edge dots.
enum TouchPhase {
  // Protobuf zero value. Treated as a tap (DOWN) by inject mapping.
  TOUCH_PHASE_UNSPECIFIED = 0;
  // Finger down or a one-shot tap when MOVE/UP never follow.
  TOUCH_PHASE_DOWN = 1;
  // Slide midpoint. Does not re-edge a targets dot.
  TOUCH_PHASE_MOVE = 2;
  // Finger up. Ends a slide stroke.
  TOUCH_PHASE_UP = 3;
}

// Coordinate space of InjectTouch x/y. Unset is framebuffer.
enum TouchSpace {
  // Protobuf zero value. Treated as framebuffer by inject mapping.
  TOUCH_SPACE_UNSPECIFIED = 0;
  // Pre-rotation native 800x480 on the Sticky.
  TOUCH_SPACE_FRAMEBUFFER = 1;
  // Page pixels for the last compose hold (gray4 hit-test inverse).
  TOUCH_SPACE_PAGE = 2;
}

// Targets walk mark. Unset when the card is not targets.
enum TargetKind {
  // Protobuf zero value. Card is not targets, or kind is unknown.
  TARGET_KIND_UNSPECIFIED = 0;
  // Single tap mark.
  TARGET_KIND_DOT = 1;
  // Horizontal slide.
  TARGET_KIND_SLIDE_X = 2;
  // Vertical slide.
  TARGET_KIND_SLIDE_Y = 3;
}

// Pre-rotation framebuffer tap (native 800x480 on the Sticky),
// or page pixels when space=PAGE. Not UART p0= / glass, not raw GT911.
message InjectTouch {
  // Horizontal coordinate in `space`.
  uint32 x = 1;
  // Vertical coordinate in `space`.
  uint32 y = 2;
  // Optional GT911 slot 0..=4. Unset is the default slot.
  optional uint32 slot = 3;
  // Who produced the tap. Injects must be SYNTHETIC.
  TouchSource source = 4;
  // Finger phase. Unset is a tap (DOWN).
  TouchPhase phase = 5;
  // Coordinate space of x/y. Unset is framebuffer.
  TouchSpace space = 6;
}

// Short key edge. Firmware applies the same short-press walk as GPIO;
// hold-to-standby / sleep stays on the physical pins.
message InjectButton {
  // Product key (ok / page-up / page-down). Unspecified is rejected.
  ProductKey key = 1;
  // Press (`true`) or release.
  bool down = 2;
}

// Host-chosen pull id. Zero is invalid and does not arm.
message GetSnapshot {
  // Host nonce that arms the frozen LAST slot.
  fixed64 nonce = 1;
}

// One frozen compose. Planes are packed 1-bit, width/8 stride.
// Encode from the armed static buffers; do not heap-clone on device.
message Snapshot {
  // Host nonce that armed the slot.
  fixed64 nonce = 1;
  // Packed width in pixels.
  uint32 width = 2;
  // Packed height in pixels.
  uint32 height = 3;
  // Mono or gray4. Unspecified is rejected.
  FrameKind kind = 4;
  // Product hold token (Sticky PageRotation discriminant), or unset.
  optional uint32 hold = 5;
  // First packed 1-bit plane (SSD1677 BW RAM).
  bytes bw = 6;
  // Second packed 1-bit plane when kind is gray4 (SSD1677
  // "red" RAM). Empty on mono. Not a red pigment on this
  // panel; host PNG may paint those bits reddish to show them.
  bytes red = 7;
  // embassy-debug Scene::persist_byte (splash=0 … targets=7).
  optional uint32 scene = 8;
  // targets::STEP 0..=6 when scene is targets.
  optional uint32 target_step = 9;
  // Dot / slide, or unspecified off the card.
  TargetKind target_kind = 10;
  // Expected page X for the current mark.
  optional uint32 target_expect_x = 11;
  // Expected page Y for the current mark.
  optional uint32 target_expect_y = 12;
}

// Host received Snapshot for this nonce. Mismatch does not free the slot.
message SnapshotAck {
  // Nonce from the Snapshot that the host accepted.
  fixed64 nonce = 1;
}

// Operator abort. No nonce; frees the slot if armed.
message SnapshotClear {}

// Slot already armed for a different nonce, or LAST was never published.
// `nonce` is the armed pull (0 when nothing is armed / never published).
message SnapshotBusy {
  // Armed pull nonce, or 0 when nothing is armed.
  fixed64 nonce = 1;
}

// Copy of one plaintext UART format_event line (no second schema).
message LogLine {
  // Device milliseconds since boot when the line was formatted.
  uint32 t_ms = 1;
  // UART text. Never a MAC.
  string text = 2;
}

// Host to device: reset the embedded MCU (not the desk host).
message Reboot {
  // Skip storage draining when recovering a stuck device.
  bool force = 1;
}

// Device to host: ACK before the MCU software-reset so ATT can flush.
message RebootAck {
  // Storage drain failed; the MCU stayed awake for forced recovery.
  bool storage_failed = 1;
}

// On-device storage operations. Fault operations require storage-test firmware.
enum StorageOperation {
  // Reject an unspecified operation.
  STORAGE_OPERATION_UNSPECIFIED = 0;
  // Query cached capacity, mount state, and job completion.
  STORAGE_OPERATION_STATUS = 1;
  // Explicitly replace partition metadata and format the selected layout.
  STORAGE_OPERATION_PROVISION = 2;
  // Verify stored test records and revalidate a ready package.
  STORAGE_OPERATION_VERIFY = 3;
  // Start bounded write/readback rounds, then poll STATUS for completion.
  STORAGE_OPERATION_STRESS = 4;
  // Synchronize, power-cycle the card rail, and remount.
  STORAGE_OPERATION_POWER_CYCLE = 5;
  // Begin a new pending package without modifying the current ready package.
  STORAGE_OPERATION_STAGE_BEGIN = 6;
  // Write the next ordered, acknowledged package chunk.
  STORAGE_OPERATION_STAGE_CHUNK = 7;
  // Validate the pending package and atomically publish readiness.
  STORAGE_OPERATION_STAGE_FINISH = 8;
  // Drain jobs and synchronize before normal reboot or sleep.
  STORAGE_OPERATION_QUIESCE = 9;
  // Test image only: reset during a scheduled stress write.
  STORAGE_OPERATION_FAULT_RESET = 10;
  // Test image only: cut the card rail during a scheduled stress write.
  STORAGE_OPERATION_FAULT_SD = 11;
  // Test image only: release the battery latch during a stress write.
  STORAGE_OPERATION_FAULT_POWER = 12;
  // Test image only: synchronize and sleep with a timer wake.
  STORAGE_OPERATION_TIMED_SLEEP = 13;
}

// One storage request. Package bytes include a uint32 JSON length prefix.
message StorageRequest {
  // Nonzero correlation id for ordered replies.
  uint64 id = 1;
  // Requested operation.
  StorageOperation operation = 2;
  // Exact file offset for a package chunk/finish, or job id to query in STATUS.
  uint64 offset = 3;
  // At most 512 bytes per acknowledged chunk.
  bytes data = 4;
  // Bounded stress rounds, or fault delay in milliseconds.
  uint32 count = 5;
  // Explicit confirmation for provisioning or destructive test controls.
  bool confirmed = 6;
}

// Storage reply. Long jobs acknowledge acceptance and complete through STATUS.
message StorageReply {
  // Request correlation id.
  uint64 id = 1;
  // Whether the operation succeeded or the background job was accepted.
  bool ok = 2;
  // Safe diagnostic token; excludes card identity and file contents.
  string message = 3;
  // Card capacity in 512-byte sectors.
  uint64 sectors = 4;
  // Whether the configured layout mounted successfully.
  bool mounted = 5;
  // A provision/verify/stress job is running.
  bool busy = 6;
  // Persisted sequence recovered on mount and advanced after readback.
  uint32 verified = 7;
  // A ready application package passed validation.
  bool ready = 8;
  // Background request whose retained completion receipt is being reported.
  uint64 job_id = 9;
  // All I/O for job_id has finished; acceptance alone leaves this false.
  bool job_complete = 10;
  // Outcome of completed job_id, independent of subsequent jobs.
  bool job_ok = 11;
  // HAL reset reason for this boot; diagnostic evidence, not a voltage reading.
  string reset_reason = 12;
  // GPIO9 digital external-power indication; absent before the first sample.
  optional bool external_power = 13;
}
