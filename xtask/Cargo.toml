[package]
name = "xtask"
version = "0.1.0"
description = "Sticky host CLI: UART, snapshots, flash-app, and host-only builds"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
rmcp = { version = "3.8.0", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }
env_logger = "0.11.11"
embassy-debug = { path = "../crates/embassy-debug", features = ["pair", "wifi"] }
remote-debug-host = { path = "../host/remote-debug-host" }
schemars = { version = "1.2.3", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simple-debug = { path = "../crates/simple-debug" }
sticky-host = { path = "../host/sticky-host" }
remote-debug-broker = { path = "../host/remote-debug-broker" }
buf-tools = "1.75.0"

[dev-dependencies]
# Exercise the firmware entropy provider with a host controller fixture.
bt-hci = "0.11.0"
critical-section = { version = "1.2.0", features = ["std"] }
embassy-crypto = { git = "https://github.com/embassy-rs/embassy.git", rev = "bd35bd7a7d19147c8bcae9c2eda99b25e597294c" }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-8"] }
embedded-io = "0.7.1"
rand_chacha = { version = "0.10.0", default-features = false }

[lints]
workspace = true
