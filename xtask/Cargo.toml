[package]
name = "xtask"
version = "0.1.0"
description = "Sticky host CLI: UART, snapshots, flash-app, and host-only builds"
publish = false
edition.workspace = true
# Matches cargo-espflash / espflash 4.5. Workspace crates stay 1.85.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.5.41", features = ["derive", "env"] }
clap-mcp = { version = "0.1.0", features = ["output-schema"] }
rmcp = "3.2.0"
env_logger = "0.11.8"
embassy-debug = { path = "../crates/embassy-debug" }
remote-debug-host = { path = "../host/remote-debug-host" }
remote-debug-wire = { path = "../crates/remote-debug-wire" }
panel-view = { path = "../crates/panel-view" }
schemars = { version = "1.2.2", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
simple-debug = { path = "../crates/simple-debug" }
sticky-host = { path = "../host/sticky-host" }
remote-debug-broker = { path = "../host/remote-debug-broker" }
buf-tools = "=1.72.0-hotfix.2"

[lints]
workspace = true
