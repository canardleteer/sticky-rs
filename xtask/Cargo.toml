[package]
name = "xtask"
version = "0.1.0"
description = "Sticky host CLI: UART, snapshots, flash-app, and host-only builds"
publish = false
edition.workspace = true
# Matches the workspace and espflash 4.5 MSRV.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.5.41", features = ["derive", "env"] }
rmcp = { version = "3.2.0", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
env_logger = "0.11.8"
embassy-debug = { path = "../crates/embassy-debug", features = ["pair", "wifi"] }
remote-debug-host = { path = "../host/remote-debug-host" }
schemars = { version = "1.2.2", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
simple-debug = { path = "../crates/simple-debug" }
sticky-host = { path = "../host/sticky-host" }
remote-debug-broker = { path = "../host/remote-debug-broker" }
buf-tools = ">=1.73.0-rc.1"

[lints]
workspace = true
