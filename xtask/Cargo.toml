[package]
name = "xtask"
version = "0.1.0"
description = "Sticky host CLI: UART, snapshots, flash-app, and host-only builds"
publish = false
edition.workspace = true
# Matches cargo-espflash / espflash 4.5. Workspace crates stay 1.85.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.5.41", features = ["derive", "env"] }
env_logger = "0.11.8"
embassy-debug = { path = "../crates/embassy-debug" }
simple-debug = { path = "../crates/simple-debug" }
sticky-host = { path = "../host/sticky-host" }

[lints]
workspace = true
